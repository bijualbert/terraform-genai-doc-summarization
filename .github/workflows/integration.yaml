name: 'integration'

on:
  push:
    branches:
      - main
  schedule:
    # Run daily at 3AM UTC (2 hours before reporter runs at 5AM)
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref }}'
  cancel-in-progress: false

env:
  DOCKER_IMAGE: gcr.io/cloud-foundation-cicd/cft/developer-tools:1

jobs:
  periodic-int-trigger:
    name: 'periodic-int-trigger'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 120

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'

      # Go, Terraform, and Cloud SDK setup removed — all three are only
      # used inside the Docker container, which ships its own copies.

      - name: 'Restore cached Docker image'
        id: docker-cache
        uses: 'actions/cache@v4'
        with:
          path: /tmp/docker-image.tar.gz
          key: cft-dev-tools-v1-${{ runner.os }}

      - name: 'Load cached Docker image'
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: gunzip -c /tmp/docker-image.tar.gz | docker load

      - name: 'Pull and cache Docker image'
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: |
          docker pull "$DOCKER_IMAGE"
          docker save "$DOCKER_IMAGE" | gzip > /tmp/docker-image.tar.gz

      - name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: >-
            projects/897785740795/locations/global/workloadIdentityPools/github-actions-pool-2/providers/github-actions-provider
          service_account: >-
            github-actions-service-acct@jss-16p1-test.iam.gserviceaccount.com
          create_credentials_file: true

      # Runs the test directly instead of via `make docker_test_integration`
      # to avoid --pull=always (would bypass the image cache) and the -it
      # flag (not appropriate in CI and can emit warnings).
      - name: 'Run integration tests'
        run: |
          docker run --rm \
            -e SERVICE_ACCOUNT_JSON \
            -v "${{ github.workspace }}":/workspace \
            "$DOCKER_IMAGE" \
            /usr/local/bin/test_integration.sh
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
