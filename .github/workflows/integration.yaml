name: 'integration'

on:
  schedule:
    # Run daily at 3AM UTC (1 hour before reporter runs at 5AM)
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref }}'
  cancel-in-progress: false

jobs:
  periodic-int-trigger:
    name: 'periodic-int-trigger'
    runs-on: 'ubuntu-latest'

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'

      - name: 'Setup Terraform'
        uses: 'hashicorp/setup-terraform@v2'
        with:
          terraform_version: '1.3.0'

      - name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v1.1.1'
        with:
          workload_identity_provider: >-
            projects/897785740795/locations/global/workloadIdentityPools/github-actions-pool-2/providers/github-actions-provider
          service_account: >-
            github-actions-service-acct@jss-16p1-test.iam.gserviceaccount.com
          create_credentials_file: true

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v1'

      - name: 'Run integration tests'
        run: make docker_test_integration
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
